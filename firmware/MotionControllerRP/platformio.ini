; Open Micro Stage controller for the STM32F401RET6 Pico-socket adapter.
;
; This project intentionally exposes one firmware target. Encoder diagnostics,
; guarded homing, onboard calibration, persistent LUT storage, closed-loop motion,
; kinematics, and USB G-code are all part of the production image.

[platformio]
default_envs = f401re_controller

[env:f401re_controller]
platform = ststm32
board = f401re_25mhz_usb
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 921600
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D STM32_CONTROLLER_F401_HSE_25MHZ
    -D STM32_CONTROLLER_USB_DP_DM_ONLY
    -Wl,-u,_printf_float
build_src_filter =
    -<*>
    +<stm32_controller/>
    +<stm32_common/>
    +<kinematic_models/kinematic_model_base.cpp>
    +<kinematic_models/kinematic_model_delta3d.cpp>
    +<utilities/logging.cpp>
